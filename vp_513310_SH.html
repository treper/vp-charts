  :root{

  .pos{color:var(--buy)!important}.neg{color:var(--sell)!important}
  #toolbar{display:flex;gap:6px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
  .tgl{padding:3px 10px;border:1px solid var(--border);border-radius:12px;background:var(--panel2);color:var(--dim);font-size:12px;cursor:pointer;user-select:none;white-space:nowrap}

  #main{display:flex;flex:1;min-height:0}
  #chartwrap{flex:1;position:relative;min-width:0}
  #chart{position:absolute;inset:0}
  #legend{position:absolute;top:8px;left:10px;z-index:20;font-size:12px;color:var(--dim);pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.8)}
  #legend .lt{color:#fff;font-weight:600}
  #side{width:300px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;flex-shrink:0}
  #side.collapsed{display:none}
  .card{padding:12px;border-bottom:1px solid var(--border)}
  .card h3{font-size:12px;color:var(--dim);font-weight:500;margin-bottom:8px;letter-spacing:.5px}
  .card canvas{width:100%;display:block}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td,th{padding:3px 4px;text-align:right;white-space:nowrap}
  th{color:var(--dim);font-weight:400;text-align:right}
  td:first-child,th:first-child{text-align:left}
  tr.hl td{color:#fff}
  .tag{display:inline-block;padding:0 5px;border-radius:8px;font-size:10px;margin-left:4px}
  .tag.naked{background:rgba(245,197,66,.18);color:var(--poc)}
  #footer{padding:4px 12px;background:var(--panel);border-top:1px solid var(--border);color:var(--dim);font-size:11px;display:flex;justify-content:space-between}
  #sideToggle{position:absolute;right:10px;top:8px;z-index:21;padding:2px 8px;border:1px solid var(--border);border-radius:10px;background:rgba(17,21,31,.85);color:var(--dim);font-size:11px;cursor:pointer}

  }

      attached: function (p) { this._req = p.requestUpdate; },
      detached: function () { this._req = null; },
      updateAllViews: function () {},
      requestUpdate: function () { this._req && this._req(); },
    };
  }

  // ---- 右侧合成 profile (类 OrderFlowMap, 但买/卖双色 + VA 高亮) ----
  function drawComposite(target) {
    if (!T.composite) return;
    target.useBitmapCoordinateSpace(function (scope) {
      var ctx = scope.context, bs = scope.bitmapSize, hpr = scope.horizontalPixelRatio, vpr = scope.verticalPixelRatio;
      var maxV = 0, i, nRows = comp.centers.length;
      for (i = 0; i < nRows; i++) { var tt = comp.buy[i] + comp.sell[i]; if (tt > maxV) maxV = tt; }
      if (maxV <= 0) return;
      var widthPx = Math.floor(120 * hpr);
      var ratio = pxPerPrice();
      var rowH = Math.max(1, Math.floor(comp.step * ratio * 0.86 * vpr));
      var yOf = function (price) { return candles.priceToCoordinate(price); };
      // VA 区域底色
      if (comp.vah != null && comp.val != null) {
        var yHi = yOf(comp.vah), yLo = yOf(comp.val);
        if (yHi != null && yLo != null) {
          ctx.fillStyle = 'rgba(74,140,255,0.05)';
          ctx.fillRect(bs.width - widthPx, Math.min(yHi, yLo) * vpr, widthPx, Math.abs(yLo - yHi) * vpr);
        }
      }
      for (i = 0; i < comp.centers.length; i++) {
        var y = yOf(comp.centers[i]);
        if (y === null) continue;
        var inVA = comp.vah != null && comp.centers[i] <= comp.vah && comp.centers[i] >= comp.val;
        var wB = comp.buy[i] / maxV * widthPx, wS = comp.sell[i] / maxV * widthPx;
        var yPx = Math.round(y * vpr) - rowH / 2;
        if (wB > 0) { ctx.fillStyle = inVA ? BUY : BUY_DIM; ctx.fillRect(bs.width - wS - wB, yPx, wB, rowH); }
        if (wS > 0) { ctx.fillStyle = inVA ? SELL : SELL_DIM; ctx.fillRect(bs.width - wS, yPx, wS, rowH); }
      }
      // POC 行
      if (comp.poc != null) {
        var yp = yOf(comp.poc);
        if (yp != null) {
          ctx.fillStyle = POC_COLOR;
          ctx.fillRect(bs.width - widthPx, Math.round(yp * vpr) - Math.max(1, rowH / 2), widthPx, Math.max(2, rowH));
        }
      }
    });
  }
  function pxPerPrice() {
    // 每单位价格对应的 CSS 像素(用两个已知桶中心估算)
    var cs = comp.centers, n = cs.length;
    if (n >= 2) {
      var y1 = candles.priceToCoordinate(cs[0]), y2 = candles.priceToCoordinate(cs[n - 1]);
      if (y1 != null && y2 != null && cs[n - 1] !== cs[0]) {
        return Math.abs(y2 - y1) / Math.abs(cs[n - 1] - cs[0]);
      }
    }
    return 0;
  }

  // ---- 可见范围 profile (缩放/平移时实时重算, 画在左侧) ----
  var vrProfile = null;
  function computeVisibleProfile() {
    var lr = chart.timeScale().getVisibleLogicalRange();
    if (!lr) { vrProfile = null; return; }
    var from = Math.max(0, Math.floor(lr.from)), to = Math.min(bars.length - 1, Math.ceil(lr.to));
    if (to - from < 5) { vrProfile = null; return; }
    var lo = Infinity, hi = -Infinity, i;
    for (i = from; i <= to; i++) { if (bars[i].l < lo) lo = bars[i].l; if (bars[i].h > hi) hi = bars[i].h; }
    var span = hi - lo;
    if (span <= 0) { vrProfile = null; return; }
    var rows = 90;
    var step = span / rows, base = lo;
    var buy = new Array(rows), sell = new Array(rows);
    for (i = 0; i < rows; i++) { buy[i] = 0; sell[i] = 0; }
    for (i = from; i <= to; i++) {
      var b = bars[i], avg = (b.o + b.c + b.h + b.l) / 4;
      var bf = b.h - b.l < 1e-12 ? (b.c >= b.o ? 1 : 0) : (b.c > b.o ? 1 : (b.c < b.o ? 0 : (b.c - b.l) / (b.h - b.l)));
      var k0 = Math.max(0, Math.floor((b.l - base) / step)), k1 = Math.min(rows - 1, Math.ceil((b.h - base) / step));
      var sum = 0, k, w = [];
      for (k = k0; k <= k1; k++) {
        var c = base + (k + 0.5) * step;
        var ww = c <= avg ? (avg - b.l < 1e-12 ? 1 : (c - b.l) / (avg - b.l))
                          : (b.h - avg < 1e-12 ? 1 : (b.h - c) / (b.h - avg));
        w.push(ww); sum += ww;
      }
      if (sum <= 0) { w = w.map(function () { return 1; }); sum = w.length; }
      for (k = k0; k <= k1; k++) {
        var share = w[k - k0] / sum * b.v;
        buy[k] += share * bf; sell[k] += share * (1 - bf);
      }
    }
    var maxV = 0, centers = [];
    for (i = 0; i < rows; i++) { var tv = buy[i] + sell[i]; if (tv > maxV) maxV = tv; centers.push(base + (i + 0.5) * step); }
    vrProfile = { base: base, step: step, rows: rows, buy: buy, sell: sell, maxV: maxV, centers: centers };
  }
  function drawVisible(target) {
    if (!T.vrvp || !vrProfile || vrProfile.maxV <= 0) return;
    target.useBitmapCoordinateSpace(function (scope) {
      var ctx = scope.context, bs = scope.bitmapSize, hpr = scope.horizontalPixelRatio, vpr = scope.verticalPixelRatio;
      var widthPx = Math.floor(90 * hpr);
      var vp = vrProfile;
      for (var i = 0; i < vp.rows; i++) {
        var y = candles.priceToCoordinate(vp.centers[i]);
        if (y === null) continue;
        var tv = vp.buy[i] + vp.sell[i];
        var w = tv / vp.maxV * widthPx;
        var rowH = Math.max(1, Math.floor(vp.step * pxPerPrice() * 0.86 * vpr));
        var yPx = Math.round(y * vpr) - rowH / 2;
        var wB = vp.buy[i] / vp.maxV * widthPx;
        if (wB > 0.5) { ctx.fillStyle = 'rgba(38,166,154,0.30)'; ctx.fillRect(0, yPx, wB, rowH); }
        if (w - wB > 0.5) { ctx.fillStyle = 'rgba(239,83,80,0.30)'; ctx.fillRect(wB, yPx, w - wB, rowH); }
      }
    });
  }

  // ---- session 分日 profile (画在每根日 K 区间上) ----
  function drawSessions(target) {
    if (!T.sessions) return;
    target.useBitmapCoordinateSpace(function (scope) {
      var ctx = scope.context, bs = scope.bitmapSize, hpr = scope.horizontalPixelRatio, vpr = scope.verticalPixelRatio;
      var ts = chart.timeScale();
      sessions.forEach(function (s) {
        var dr = dayIdx[s.date];
        if (!dr) return;
        var x1 = ts.timeToCoordinate(bars[dr[0]].time);
        var x2 = ts.timeToCoordinate(bars[dr[1]].time);
        if (x1 == null || x2 == null) return;
        var xR = Math.round(x2 * hpr);
        var prof = s.profile, maxV = 0, i;
        for (i = 0; i < prof.centers.length; i++) { var tv = prof.buy[i] + prof.sell[i]; if (tv > maxV) maxV = tv; }
        if (maxV <= 0) return;
        var widthPx = Math.max(8, Math.floor((x2 - x1) * hpr * 0.92));
        var rowH = Math.max(1, Math.floor(prof.step * pxPerPrice() * 0.8 * vpr));
        for (i = 0; i < prof.centers.length; i++) {
          var y = candles.priceToCoordinate(prof.centers[i]);
          if (y === null) continue;
          var tv2 = prof.buy[i] + prof.sell[i];
          if (tv2 <= 0) continue;
          var w = tv2 / maxV * widthPx;
          var wB = prof.buy[i] / maxV * widthPx;
          var yPx = Math.round(y * vpr) - rowH / 2;
          if (wB > 0.5) { ctx.fillStyle = 'rgba(38,166,154,0.22)'; ctx.fillRect(xR - w, yPx, wB, rowH); }
          if (w - wB > 0.5) { ctx.fillStyle = 'rgba(239,83,80,0.22)'; ctx.fillRect(xR - w + wB, yPx, w - wB, rowH); }
        }
        // 当日 POC 短线
        if (s.profile.poc != null) {
          var yp = candles.priceToCoordinate(s.profile.poc);
          if (yp != null) {
            ctx.fillStyle = 'rgba(245,197,66,0.55)';
            ctx.fillRect(xR - widthPx, Math.round(yp * vpr) - 1, widthPx, 2);
          }
        }
      });
    });
  }

  var primComposite = makePrimitive(drawComposite, 'bottom');
  var primSessions = makePrimitive(drawSessions, 'bottom');
  var primVisible = makePrimitive(drawVisible, 'bottom');
  candles.attachPrimitive(primComposite);
  candles.attachPrimitive(primSessions);
  candles.attachPrimitive(primVisible);

  // ---- 价格线 ----
  var priceLines = [];
  function clearLines() { priceLines.forEach(function (l) { candles.removePriceLine(l); }); priceLines = []; }
  function addLine(price, color, title, style, width) {
    priceLines.push(candles.createPriceLine({
      price: price, color: color, lineWidth: width || 1, lineStyle: style,
      axisLabelVisible: true, title: title,
    }));
  }
  function rebuildLines() {
    clearLines();
    if (T.composite && comp.poc != null) addLine(comp.poc, POC_COLOR, 'POC ' + fmtP(comp.poc), LightweightCharts.LineStyle.Solid, 2);
    if (T.composite && comp.vah != null) addLine(comp.vah, VA_COLOR, 'VAH ' + fmtP(comp.vah), LightweightCharts.LineStyle.Dashed, 1);
    if (T.composite && comp.val != null) addLine(comp.val, VA_COLOR, 'VAL ' + fmtP(comp.val), LightweightCharts.LineStyle.Dashed, 1);
    if (T.naked) sessions.forEach(function (s) {
      if (s.naked_poc && s.profile.poc != null)
        addLine(s.profile.poc, 'rgba(245,197,66,0.65)', 'nPOC ' + s.date.slice(5), LightweightCharts.LineStyle.Dotted, 1);
    });
    if (T.hvnlvn) {
      (comp.hvn || []).slice(0, 10).forEach(function (p) { addLine(p, 'rgba(38,166,154,0.5)', 'HVN', LightweightCharts.LineStyle.Dotted, 1); });
      (comp.lvn || []).slice(0, 10).forEach(function (p) { addLine(p, 'rgba(122,134,153,0.45)', 'LVN', LightweightCharts.LineStyle.Dotted, 1); });
    }
    if (cyq && T.cyq) {
      addLine(cyq.avg_cost, '#c678dd', '成本 ' + fmtP(cyq.avg_cost), LightweightCharts.LineStyle.Dashed, 1);
    }
  }

  // ------------------------------------------------------------------
  // 开关

  var T = { composite: true, sessions: false, vrvp: true, cyq: true, naked: true, hvnlvn: false, cvd: false };
  var LABELS = { composite: '合成VP', sessions: '分日VP', vrvp: '可见范围VP', cyq: '筹码', naked: 'Naked POC', hvnlvn: 'HVN/LVN', cvd: 'CVD' };

  // ------------------------------------------------------------------
  // 侧栏: CYQ 筹码面板
  // ------------------------------------------------------------------
  function renderCyqPanel() {
    var cv = document.getElementById('cyqCanvas');
    var stats = document.getElementById('cyqStats');
    if (!cyq) { stats.innerHTML = '<span style="color:#566">无换手率数据,未计算筹码分布</span>'; cv.style.display = 'none'; return; }
    if (!T.cyq) { cv.style.display = 'none'; stats.innerHTML = '<span style="color:#566">已隐藏(顶部开关)</span>'; return; }
    cv.style.display = 'block';
    var W = cv.clientWidth || 276, H = 210;
    cv.width = W * 2; cv.height = H * 2;
    var ctx = cv.getContext('2d'); ctx.scale(2, 2);
    ctx.clearRect(0, 0, W, H);
    var maxC = 0, i;
    for (i = 0; i < cyq.chips.length; i++) if (cyq.chips[i] > maxC) maxC = cyq.chips[i];
    var yLo = cyq.centers[0], yHi = cyq.centers[cyq.centers.length - 1];
    var yOf = function (p) { return H - 16 - (p - yLo) / (yHi - yLo) * (H - 28); };
    var bw = W - 56;
    for (i = 0; i < cyq.centers.length; i++) {
      if (cyq.chips[i] <= 0) continue;
      var y = yOf(cyq.centers[i]);
      var w = cyq.chips[i] / maxC * bw;
      ctx.fillStyle = cyq.centers[i] <= cyq.close ? 'rgba(227,100,93,0.85)' : 'rgba(81,140,255,0.75)';
      var rh = Math.max(1, (H - 28) / cyq.centers.length * 0.8);
      ctx.fillRect(0, y - rh / 2, w, rh);
    }
    // 当前价线
    var yc = yOf(cyq.close);
    ctx.strokeStyle = '#fff'; ctx.setLineDash([4, 3]); ctx.beginPath();
    ctx.moveTo(0, yc); ctx.lineTo(W - 46, yc); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif';
    ctx.fillText(fmtP(cyq.close), W - 44, yc + 3);
    // 标注 POC / 成本
    [['POC', cyq.poc, '#f5c542'], ['成本', cyq.avg_cost, '#c678dd']].forEach(function (m) {
      var y = yOf(m[1]);
      ctx.strokeStyle = m[2]; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W - 46, y); ctx.stroke();
      ctx.fillStyle = m[2]; ctx.fillText(m[0] + ' ' + fmtP(m[1]), 2, y - 3);
    });
    var pct = (cyq.benefit * 100).toFixed(1);
    stats.innerHTML =
      '<table>' +
      '<tr><th>获利比例</th><td class="' + (cyq.benefit >= 0.5 ? 'pos' : 'neg') + '">' + pct + '%</td>' +
      '<th>平均成本</th><td>' + fmtP(cyq.avg_cost) + '</td></tr>' +
      '<tr><th>70% 筹码</th><td>' + fmtP(cyq.r70[0]) + ' ~ ' + fmtP(cyq.r70[1]) + '</td>' +
      '<th>集中度</th><td>' + (cyq.c70 * 100).toFixed(1) + '%</td></tr>' +
      '<tr><th>90% 筹码</th><td>' + fmtP(cyq.r90[0]) + ' ~ ' + fmtP(cyq.r90[1]) + '</td>' +
      '<th>集中度</th><td>' + (cyq.c90 * 100).toFixed(1) + '%</td></tr>' +
      '</table>' +
      '<div style="color:#566;font-size:10px;margin-top:4px">红=获利筹码 蓝=套牢筹码 · ' + cyq.date + ' 收盘 ' + fmtP(cyq.close) + '</div>';
  }

  // ---- 合成分布侧栏大图 ----
  function renderCompPanel() {
    var cv = document.getElementById('compCanvas');
    var stats = document.getElementById('compStats');
    var W = cv.clientWidth || 276, H = 240;
    cv.width = W * 2; cv.height = H * 2;
    var ctx = cv.getContext('2d'); ctx.scale(2, 2);
    ctx.clearRect(0, 0, W, H);
    var maxV = 0, i;
    var tot = [];
    for (i = 0; i < comp.centers.length; i++) { tot.push(comp.buy[i] + comp.sell[i]); if (tot[i] > maxV) maxV = tot[i]; }
    var yLo = comp.centers[0], yHi = comp.centers[comp.centers.length - 1];
    var yOf = function (p) { return H - 14 - (p - yLo) / (yHi - yLo) * (H - 24); };
    var bw = W - 50;
    var rh = Math.max(1, (H - 24) / comp.centers.length * 0.82);
    for (i = 0; i < comp.centers.length; i++) {
      if (tot[i] <= 0) continue;
      var y = yOf(comp.centers[i]);
      var wB = comp.buy[i] / maxV * bw, wS = comp.sell[i] / maxV * bw;
      ctx.fillStyle = BUY; ctx.fillRect(0, y - rh / 2, wB, rh);
      ctx.fillStyle = SELL; ctx.fillRect(wB, y - rh / 2, wS, rh);
    }
    // VA / POC
    ctx.strokeStyle = VA_COLOR; ctx.setLineDash([5, 4]);
    [comp.vah, comp.val].forEach(function (p) {
      if (p == null) return;
      var y = yOf(p); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W - 42, y); ctx.stroke();
    });
    ctx.setLineDash([]);
    var yp = yOf(comp.poc);
    ctx.strokeStyle = POC_COLOR; ctx.beginPath(); ctx.moveTo(0, yp); ctx.lineTo(W - 42, yp); ctx.stroke();
    ctx.fillStyle = POC_COLOR; ctx.font = '10px sans-serif';
    ctx.fillText('POC ' + fmtP(comp.poc), 2, yp - 3);
    // HVN/LVN 标记
    ctx.fillStyle = 'rgba(38,166,154,0.9)';
    (comp.hvn || []).forEach(function (p) { var y = yOf(p); ctx.fillRect(W - 40, y - 2, 6, 4); });
    ctx.fillStyle = 'rgba(122,134,153,0.8)';
    (comp.lvn || []).forEach(function (p) { var y = yOf(p); ctx.fillRect(W - 40, y - 1, 6, 2); });
    var totV = comp.buy.reduce(function (a, b) { return a + b; }, 0) + comp.sell.reduce(function (a, b) { return a + b; }, 0);
    var buyV = comp.buy.reduce(function (a, b) { return a + b; }, 0);
    var bPct = totV > 0 ? (buyV / totV * 100).toFixed(1) : '-';
    stats.innerHTML =
      '<table>' +
      '<tr><th>POC</th><td>' + fmtP(comp.poc) + '</td><th>Value Area</th><td>' + fmtP(comp.val) + ' ~ ' + fmtP(comp.vah) + '</td></tr>' +
      '<tr><th>买量占比</th><td class="pos">' + bPct + '%</td><th>总量</th><td>' + fmtV(totV) + '</td></tr>' +
      '</table>' +
      '<div style="color:#566;font-size:10px;margin-top:4px">HVN(绿块)=高量支撑/阻力 · LVN(灰块)=低量真空</div>';
  }

      chips: chips.map(function (x) { return Math.round(x / total * 1e6) / 1e6; }),

  }

          if (m1 && m1.length) {
            var merged = mergeBars(RAW, m1);
            if (merged.bars.length !== RAW.length ||
                merged.bars[merged.bars.length - 1].t !== RAW[RAW.length - 1].t) {
              var comp2 = compositeFromBars(merged.bars);
              var sess2 = sessionsFromMerged(merged, D.sessions || []);
              RAW = merged.bars;
              API.replaceBars(toChartBars(merged.bars));
              if (comp2) API.replaceComposite(comp2);
              if (sess2 && sess2.length) API.replaceSessions(sess2);
              changed = true;
            }
          }
          if (dailyArr) {
            var cyq2 = cyqFromDaily(dailyArr);
            if (cyq2) { API.replaceCyq(cyq2); changed = true; }
          }
          API.renderAll();
          state.lastOk = new Date();
          state.failCnt = 0;
          var chg = q.prevClose ? (q.price / q.prevClose - 1) * 100 : 0;
          setStatus((changed ? '● 已更新 ' : '○ 无变化 ') +
            state.lastOk.toTimeString().slice(0, 8) +
            ' · 现价 ' + q.price + ' (' + (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%)' +
            ' · ' + (isMarketHours() ? '盘中 30s 轮询' : '休市 5min 轮询'));
        } catch (e) {
          if (window.__vpErrs) window.__vpErrs.push('live: ' + String(e));
          setStatus('✕ 更新异常: ' + e.message, true);
        }
        state.busy = false;
        schedule();
      });
    });
  }

  function schedule() {
    if (state.timer) clearTimeout(state.timer);
    if (!state.on) return;
    state.timer = setTimeout(function () { refresh(); }, isMarketHours() ? 30000 : 300000);
  }

  // 实时开关(追加到 toolbar)
  var tgl = document.createElement('span');
  tgl.className = 'tgl on';
  tgl.textContent = '实时';
  tgl.title = '盘中每 30 秒拉取腾讯行情并在浏览器重算 profile';
  tgl.onclick = function () {
    state.on = !state.on;
    tgl.className = 'tgl' + (state.on ? ' on' : '');
    if (state.on) refresh();
    else if (state.timer) { clearTimeout(state.timer); state.timer = null; setStatus('实时已关'); }
  };
  document.getElementById('toolbar').appendChild(tgl);

  // 加载 2.5s 后首刷(与快照做一次等价合并), 之后进入轮询
  setTimeout(function () { refresh(); }, 2500);

  // 调试/测试钩子 (bars 为 raw 格式)
  window.__vpLive = {
    refresh: refresh, mergeBars: mergeBars, toChartBars: toChartBars,
    raw: function () { return RAW; },
    compositeFromBars: compositeFromBars, sessionsFromMerged: sessionsFromMerged,
    cyqFromDaily: cyqFromDaily,
  };
})();

</script>
</body>
</html>
