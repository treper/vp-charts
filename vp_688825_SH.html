<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>688825.SH 长鑫科技 · Volume Profile</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#11151f; --panel2:#161b28; --border:#232a3a;
    --text:#c9d1e0; --dim:#7a8699; --buy:#26a69a; --sell:#ef5350;
    --poc:#f5c542; --accent:#4a8cff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",Roboto,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
  header h1{font-size:15px;font-weight:600;color:#fff;white-space:nowrap}
  header .meta{color:var(--dim);font-size:12px;white-space:nowrap}
  header .stats{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap;font-size:12px}
  .stats b{color:#fff;font-weight:600}
  .stats .k{color:var(--dim);margin-right:3px}
  .pos{color:var(--buy)!important}.neg{color:var(--sell)!important}
  #toolbar{display:flex;gap:6px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
  .tgl{padding:3px 10px;border:1px solid var(--border);border-radius:12px;background:var(--panel2);color:var(--dim);font-size:12px;cursor:pointer;user-select:none;white-space:nowrap}
  .tgl.on{color:#fff;border-color:var(--accent);background:rgba(74,140,255,.15)}
  #main{display:flex;flex:1;min-height:0}
  #chartwrap{flex:1;position:relative;min-width:0}
  #chart{position:absolute;inset:0}
  #legend{position:absolute;top:8px;left:10px;z-index:20;font-size:12px;color:var(--dim);pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.8)}
  #legend .lt{color:#fff;font-weight:600}
  #side{width:300px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;flex-shrink:0}
  #side.collapsed{display:none}
  .card{padding:12px;border-bottom:1px solid var(--border)}
  .card h3{font-size:12px;color:var(--dim);font-weight:500;margin-bottom:8px;letter-spacing:.5px}
  .card canvas{width:100%;display:block}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td,th{padding:3px 4px;text-align:right;white-space:nowrap}
  th{color:var(--dim);font-weight:400;text-align:right}
  td:first-child,th:first-child{text-align:left}
  tr.hl td{color:#fff}
  .tag{display:inline-block;padding:0 5px;border-radius:8px;font-size:10px;margin-left:4px}
  .tag.naked{background:rgba(245,197,66,.18);color:var(--poc)}
  #footer{padding:4px 12px;background:var(--panel);border-top:1px solid var(--border);color:var(--dim);font-size:11px;display:flex;justify-content:space-between}
  #sideToggle{position:absolute;right:10px;top:8px;z-index:21;padding:2px 8px;border:1px solid var(--border);border-radius:10px;background:rgba(17,21,31,.85);color:var(--dim);font-size:11px;cursor:pointer}
  @media (max-width:720px){
    #side{position:absolute;right:0;top:0;bottom:0;z-index:30;width:86vw;box-shadow:-8px 0 24px rgba(0,0,0,.5)}
    header .stats{display:none}
  }
</style>
</head>

      var y1 = candles.priceToCoordinate(cs[0]), y2 = candles.priceToCoordinate(cs[n - 1]);
      if (y1 != null && y2 != null && cs[n - 1] !== cs[0]) {
        return Math.abs(y2 - y1) / Math.abs(cs[n - 1] - cs[0]);
      }
    }
    return 0;
  }

  // ---- 可见范围 profile (缩放/平移时实时重算, 画在左侧) ----
  var vrProfile = null;
  function computeVisibleProfile() {
    var lr = chart.timeScale().getVisibleLogicalRange();
    if (!lr) { vrProfile = null; return; }
    var from = Math.max(0, Math.floor(lr.from)), to = Math.min(bars.length - 1, Math.ceil(lr.to));
    if (to - from < 5) { vrProfile = null; return; }
    var lo = Infinity, hi = -Infinity, i;
    for (i = from; i <= to; i++) { if (bars[i].l < lo) lo = bars[i].l; if (bars[i].h > hi) hi = bars[i].h; }
    var span = hi - lo;
    if (span <= 0) { vrProfile = null; return; }
    var rows = 90;
    var step = span / rows, base = lo;
    var buy = new Array(rows), sell = new Array(rows);
    for (i = 0; i < rows; i++) { buy[i] = 0; sell[i] = 0; }
    for (i = from; i <= to; i++) {
      var b = bars[i], avg = (b.o + b.c + b.h + b.l) / 4;
      var bf = b.h - b.l < 1e-12 ? (b.c >= b.o ? 1 : 0) : (b.c > b.o ? 1 : (b.c < b.o ? 0 : (b.c - b.l) / (b.h - b.l)));
      var k0 = Math.max(0, Math.floor((b.l - base) / step)), k1 = Math.min(rows - 1, Math.ceil((b.h - base) / step));
      var sum = 0, k, w = [];
      for (k = k0; k <= k1; k++) {
        var c = base + (k + 0.5) * step;
        var ww = c <= avg ? (avg - b.l < 1e-12 ? 1 : (c - b.l) / (avg - b.l))
                          : (b.h - avg < 1e-12 ? 1 : (b.h - c) / (b.h - avg));
        w.push(ww); sum += ww;
      }
      if (sum <= 0) { w = w.map(function () { return 1; }); sum = w.length; }
      for (k = k0; k <= k1; k++) {
        var share = w[k - k0] / sum * b.v;
        buy[k] += share * bf; sell[k] += share * (1 - bf);
      }
    }
    var maxV = 0, centers = [];
    for (i = 0; i < rows; i++) { var tv = buy[i] + sell[i]; if (tv > maxV) maxV = tv; centers.push(base + (i + 0.5) * step); }
    vrProfile = { base: base, step: step, rows: rows, buy: buy, sell: sell, maxV: maxV, centers: centers };
  }
  function drawVisible(target) {
    if (!T.vrvp || !vrProfile || vrProfile.maxV <= 0) return;
    target.useBitmapCoordinateSpace(function (scope) {
      var ctx = scope.context, bs = scope.bitmapSize, hpr = scope.horizontalPixelRatio, vpr = scope.verticalPixelRatio;
      var widthPx = Math.floor(90 * hpr);
      var vp = vrProfile;
      for (var i = 0; i < vp.rows; i++) {
        var y = candles.priceToCoordinate(vp.centers[i]);
        if (y === null) continue;
        var tv = vp.buy[i] + vp.sell[i];
        var w = tv / vp.maxV * widthPx;
        var rowH = Math.max(1, Math.floor(vp.step * pxPerPrice() * 0.86 * vpr));
        var yPx = Math.round(y * vpr) - rowH / 2;
        var wB = vp.buy[i] / vp.maxV * widthPx;
        if (wB > 0.5) { ctx.fillStyle = 'rgba(38,166,154,0.30)'; ctx.fillRect(0, yPx, wB, rowH); }
        if (w - wB > 0.5) { ctx.fillStyle = 'rgba(239,83,80,0.30)'; ctx.fillRect(wB, yPx, w - wB, rowH); }
      }
    });
  }

  // ---- session 分日 profile (画在每根日 K 区间上) ----
  function drawSessions(target) {
    if (!T.sessions) return;
    target.useBitmapCoordinateSpace(function (scope) {
      var ctx = scope.context, bs = scope.bitmapSize, hpr = scope.horizontalPixelRatio, vpr = scope.verticalPixelRatio;
      var ts = chart.timeScale();
      sessions.forEach(function (s) {
        var dr = dayIdx[s.date];
        if (!dr) return;
        var x1 = ts.timeToCoordinate(bars[dr[0]].time);
        var x2 = ts.timeToCoordinate(bars[dr[1]].time);
        if (x1 == null || x2 == null) return;
        var xR = Math.round(x2 * hpr);
        var prof = s.profile, maxV = 0, i;
        for (i = 0; i < prof.centers.length; i++) { var tv = prof.buy[i] + prof.sell[i]; if (tv > maxV) maxV = tv; }
        if (maxV <= 0) return;
        var widthPx = Math.max(8, Math.floor((x2 - x1) * hpr * 0.92));
        var rowH = Math.max(1, Math.floor(prof.step * pxPerPrice() * 0.8 * vpr));
        for (i = 0; i < prof.centers.length; i++) {
          var y = candles.priceToCoordinate(prof.centers[i]);
          if (y === null) continue;
          var tv2 = prof.buy[i] + prof.sell[i];
          if (tv2 <= 0) continue;
          var w = tv2 / maxV * widthPx;
          var wB = prof.buy[i] / maxV * widthPx;
          var yPx = Math.round(y * vpr) - rowH / 2;
          if (wB > 0.5) { ctx.fillStyle = 'rgba(38,166,154,0.22)'; ctx.fillRect(xR - w, yPx, wB, rowH); }
          if (w - wB > 0.5) { ctx.fillStyle = 'rgba(239,83,80,0.22)'; ctx.fillRect(xR - w + wB, yPx, w - wB, rowH); }
        }
        // 当日 POC 短线
        if (s.profile.poc != null) {
          var yp = candles.priceToCoordinate(s.profile.poc);
          if (yp != null) {
            ctx.fillStyle = 'rgba(245,197,66,0.55)';
            ctx.fillRect(xR - widthPx, Math.round(yp * vpr) - 1, widthPx, 2);
          }
        }
      });
    });
  }

  var primComposite = makePrimitive(drawComposite, 'bottom');
  var primSessions = makePrimitive(drawSessions, 'bottom');
  var primVisible = makePrimitive(drawVisible, 'bottom');
  candles.attachPrimitive(primComposite);
  candles.attachPrimitive(primSessions);
  candles.attachPrimitive(primVisible);

  // ---- 价格线 ----
  var priceLines = [];
  function clearLines() { priceLines.forEach(function (l) { candles.removePriceLine(l); }); priceLines = []; }
  function addLine(price, color, title, style, width) {
    priceLines.push(candles.createPriceLine({
      price: price, color: color, lineWidth: width || 1, lineStyle: style,
      axisLabelVisible: true, title: title,
    }));
  }
  function rebuildLines() {
    clearLines();
    if (T.composite && comp.poc != null) addLine(comp.poc, POC_COLOR, 'POC ' + fmtP(comp.poc), LightweightCharts.LineStyle.Solid, 2);
    if (T.composite && comp.vah != null) addLine(comp.vah, VA_COLOR, 'VAH ' + fmtP(comp.vah), LightweightCharts.LineStyle.Dashed, 1);
    if (T.composite && comp.val != null) addLine(comp.val, VA_COLOR, 'VAL ' + fmtP(comp.val), LightweightCharts.LineStyle.Dashed, 1);
    if (T.naked) sessions.forEach(function (s) {
      if (s.naked_poc && s.profile.poc != null)
        addLine(s.profile.poc, 'rgba(245,197,66,0.65)', 'nPOC ' + s.date.slice(5), LightweightCharts.LineStyle.Dotted, 1);
    });
    if (T.hvnlvn) {
      (comp.hvn || []).slice(0, 10).forEach(function (p) { addLine(p, 'rgba(38,166,154,0.5)', 'HVN', LightweightCharts.LineStyle.Dotted, 1); });
      (comp.lvn || []).slice(0, 10).forEach(function (p) { addLine(p, 'rgba(122,134,153,0.45)', 'LVN', LightweightCharts.LineStyle.Dotted, 1); });
    }
    if (cyq && T.cyq) {
      addLine(cyq.avg_cost, '#c678dd', '成本 ' + fmtP(cyq.avg_cost), LightweightCharts.LineStyle.Dashed, 1);
    }
  }

  // ------------------------------------------------------------------
  // 开关
  // ------------------------------------------------------------------
  var T = { composite: true, sessions: false, vrvp: true, cyq: true, naked: true, hvnlvn: false, cvd: false };
  var LABELS = { composite: '合成VP', sessions: '分日VP', vrvp: '可见范围VP', cyq: '筹码', naked: 'Naked POC', hvnlvn: 'HVN/LVN', cvd: 'CVD' };
  var toolbar = document.getElementById('toolbar');
  Object.keys(T).forEach(function (k) {
    var el = document.createElement('span');
    el.className = 'tgl' + (T[k] ? ' on' : '');
    el.textContent = LABELS[k];
    el.onclick = function () {
      T[k] = !T[k];
      el.className = 'tgl' + (T[k] ? ' on' : '');
      if (k === 'cvd') { cvdSeries.applyOptions({ visible: T.cvd }); }
      if (k === 'cyq' && cyq) { renderCyqPanel(); rebuildLines(); }
      rebuildLines(); chart.applyOptions({});
    };
    toolbar.appendChild(el);
  });

  // ------------------------------------------------------------------
  // 侧栏: CYQ 筹码面板
  // ------------------------------------------------------------------
  function renderCyqPanel() {
    var cv = document.getElementById('cyqCanvas');
    var stats = document.getElementById('cyqStats');
    if (!cyq) { stats.innerHTML = '<span style="color:#566">无换手率数据,未计算筹码分布</span>'; cv.style.display = 'none'; return; }
    if (!T.cyq) { cv.style.display = 'none'; stats.innerHTML = '<span style="color:#566">已隐藏(顶部开关)</span>'; return; }
    cv.style.display = 'block';
    var W = cv.clientWidth || 276, H = 210;
    cv.width = W * 2; cv.height = H * 2;
    var ctx = cv.getContext('2d'); ctx.scale(2, 2);
    ctx.clearRect(0, 0, W, H);
    var maxC = 0, i;
    for (i = 0; i < cyq.chips.length; i++) if (cyq.chips[i] > maxC) maxC = cyq.chips[i];
    var yLo = cyq.centers[0], yHi = cyq.centers[cyq.centers.length - 1];
    var yOf = function (p) { return H - 16 - (p - yLo) / (yHi - yLo) * (H - 28); };
    var bw = W - 56;
    for (i = 0; i < cyq.centers.length; i++) {
      if (cyq.chips[i] <= 0) continue;
      var y = yOf(cyq.centers[i]);
      var w = cyq.chips[i] / maxC * bw;
      ctx.fillStyle = cyq.centers[i] <= cyq.close ? 'rgba(227,100,93,0.85)' : 'rgba(81,140,255,0.75)';
      var rh = Math.max(1, (H - 28) / cyq.centers.length * 0.8);
      ctx.fillRect(0, y - rh / 2, w, rh);
    }
    // 当前价线
    var yc = yOf(cyq.close);
    ctx.strokeStyle = '#fff'; ctx.setLineDash([4, 3]); ctx.beginPath();
    ctx.moveTo(0, yc); ctx.lineTo(W - 46, yc); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif';
    ctx.fillText(fmtP(cyq.close), W - 44, yc + 3);
    // 标注 POC / 成本
    [['POC', cyq.poc, '#f5c542'], ['成本', cyq.avg_cost, '#c678dd']].forEach(function (m) {
      var y = yOf(m[1]);
      ctx.strokeStyle = m[2]; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W - 46, y); ctx.stroke();
      ctx.fillStyle = m[2]; ctx.fillText(m[0] + ' ' + fmtP(m[1]), 2, y - 3);
    });
    var pct = (cyq.benefit * 100).toFixed(1);
    stats.innerHTML =
      '<table>' +
      '<tr><th>获利比例</th><td class="' + (cyq.benefit >= 0.5 ? 'pos' : 'neg') + '">' + pct + '%</td>' +
      '<th>平均成本</th><td>' + fmtP(cyq.avg_cost) + '</td></tr>' +
      '<tr><th>70% 筹码</th><td>' + fmtP(cyq.r70[0]) + ' ~ ' + fmtP(cyq.r70[1]) + '</td>' +
      '<th>集中度</th><td>' + (cyq.c70 * 100).toFixed(1) + '%</td></tr>' +
      '<tr><th>90% 筹码</th><td>' + fmtP(cyq.r90[0]) + ' ~ ' + fmtP(cyq.r90[1]) + '</td>' +
      '<th>集中度</th><td>' + (cyq.c90 * 100).toFixed(1) + '%</td></tr>' +
      '</table>' +
      '<div style="color:#566;font-size:10px;margin-top:4px">红=获利筹码 蓝=套牢筹码 · ' + cyq.date + ' 收盘 ' + fmtP(cyq.close) + '</div>';
  }

  // ---- 合成分布侧栏大图 ----
  function renderCompPanel() {
    var cv = document.getElementById('compCanvas');
    var stats = document.getElementById('compStats');
    var W = cv.clientWidth || 276, H = 240;
    cv.width = W * 2; cv.height = H * 2;
    var ctx = cv.getContext('2d'); ctx.scale(2, 2);
    ctx.clearRect(0, 0, W, H);
    var maxV = 0, i;
    var tot = [];
    for (i = 0; i < comp.centers.length; i++) { tot.push(comp.buy[i] + comp.sell[i]); if (tot[i] > maxV) maxV = tot[i]; }
    var yLo = comp.centers[0], yHi = comp.centers[comp.centers.length - 1];
    var yOf = function (p) { return H - 14 - (p - yLo) / (yHi - yLo) * (H - 24); };
    var bw = W - 50;
    var rh = Math.max(1, (H - 24) / comp.centers.length * 0.82);
    for (i = 0; i < comp.centers.length; i++) {
      if (tot[i] <= 0) continue;
      var y = yOf(comp.centers[i]);
      var wB = comp.buy[i] / maxV * bw, wS = comp.sell[i] / maxV * bw;
      ctx.fillStyle = BUY; ctx.fillRect(0, y - rh / 2, wB, rh);
      ctx.fillStyle = SELL; ctx.fillRect(wB, y - rh / 2, wS, rh);
    }
    // VA / POC
    ctx.strokeStyle = VA_COLOR; ctx.setLineDash([5, 4]);
    [comp.vah, comp.val].forEach(function (p) {
      if (p == null) return;
      var y = yOf(p); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W - 42, y); ctx.stroke();
    });
    ctx.setLineDash([]);
    var yp = yOf(comp.poc);
    ctx.strokeStyle = POC_COLOR; ctx.beginPath(); ctx.moveTo(0, yp); ctx.lineTo(W - 42, yp); ctx.stroke();
    ctx.fillStyle = POC_COLOR; ctx.font = '10px sans-serif';
    ctx.fillText('POC ' + fmtP(comp.poc), 2, yp - 3);
    // HVN/LVN 标记
    ctx.fillStyle = 'rgba(38,166,154,0.9)';
    (comp.hvn || []).forEach(function (p) { var y = yOf(p); ctx.fillRect(W - 40, y - 2, 6, 4); });
    ctx.fillStyle = 'rgba(122,134,153,0.8)';
    (comp.lvn || []).forEach(function (p) { var y = yOf(p); ctx.fillRect(W - 40, y - 1, 6, 2); });
    var totV = comp.buy.reduce(function (a, b) { return a + b; }, 0) + comp.sell.reduce(function (a, b) { return a + b; }, 0);
    var buyV = comp.buy.reduce(function (a, b) { return a + b; }, 0);
    var bPct = totV > 0 ? (buyV / totV * 100).toFixed(1) : '-';
    stats.innerHTML =
      '<table>' +
      '<tr><th>POC</th><td>' + fmtP(comp.poc) + '</td><th>Value Area</th><td>' + fmtP(comp.val) + ' ~ ' + fmtP(comp.vah) + '</td></tr>' +
      '<tr><th>买量占比</th><td class="pos">' + bPct + '%</td><th>总量</th><td>' + fmtV(totV) + '</td></tr>' +
      '</table>' +
      '<div style="color:#566;font-size:10px;margin-top:4px">HVN(绿块)=高量支撑/阻力 · LVN(灰块)=低量真空</div>';
  }

  // ---- session 表 ----
  function renderSessTable() {
    var el = document.getElementById('sessTable');
    var rows = '<table><tr><th>日期</th><th>POC</th><th>VA</th><th>Δ%</th><th></th></tr>';
    sessions.slice().reverse().forEach(function (s) {
      var d = s.buy - s.sell;
      var dp = (s.buy + s.sell) > 0 ? (d / (s.buy + s.sell) * 100).toFixed(0) : '-';
      rows += '<tr' + (s.naked_poc ? ' class="hl"' : '') + '><td>' + s.date.slice(5) +
        '</td><td>' + fmtP(s.profile.poc) +
        '</td><td>' + fmtP(s.profile.val) + '~' + fmtP(s.profile.vah) +
        '</td><td class="' + (d >= 0 ? 'pos' : 'neg') + '">' + dp + '%' +
        '</td><td>' + (s.naked_poc ? '<span class="tag naked">未回踩</span>' : '') + '</td></tr>';
    });
    el.innerHTML = rows + '</table>';
  }

  // ------------------------------------------------------------------
  // 头部统计 + 图例
  // ------------------------------------------------------------------
  function stat(k, v, cls) { return '<span><span class="k">' + k + '</span><b class="' + (cls || '') + '">' + v + '</b></span>'; }
  function updateHeadStats() {
    var totV = 0, totB = 0, cvdNow = 0;
    bars.forEach(function (b) { totV += b.v; totB += b.buy; cvdNow += b.buy - b.sell; });
    var dPct = totV > 0 ? (totB / totV * 100).toFixed(1) : '-';
    document.getElementById('headstats').innerHTML =
      stat('POC', fmtP(comp.poc), POC_COLOR) +
      stat('VA', fmtP(comp.val) + '~' + fmtP(comp.vah)) +
      stat('买占比', dPct + '%', totB / totV >= 0.5 ? 'pos' : 'neg') +
      stat('CVD', fmtV(cvdNow), cvdNow >= 0 ? 'pos' : 'neg') +
      stat('窗口', bars.length + '根/' + Object.keys(dayIdx).length + '日');
  }
  updateHeadStats();
  document.getElementById('legend').innerHTML =
    '<span class="lt">' + D.symbol + '</span> <span class="lt">' + (D.name || '') + '</span> ' + D.granularity;

  // ------------------------------------------------------------------
  // 可见范围重算(防抖)
  // ------------------------------------------------------------------
  var vrTimer = null;
  function onRangeChanged() {
    if (vrTimer) clearTimeout(vrTimer);
    vrTimer = setTimeout(function () {
      computeVisibleProfile();
      chart.applyOptions({});
    }, 250);
  }
  chart.timeScale().subscribeVisibleLogicalRangeChange(onRangeChanged);

  // 侧栏开关
  document.getElementById('sideToggle').onclick = function () {
    var side = document.getElementById('side');
    side.classList.toggle('collapsed');
    setTimeout(function () { chart.applyOptions({}); }, 50);
  };

  // crosshair 图例
  chart.subscribeCrosshairMove(function (param) {
    var el = document.getElementById('legend');
    if (!param.time) { el.innerHTML = '<span class="lt">' + D.symbol + '</span> <span class="lt">' + (D.name || '') + '</span> ' + D.granularity; return; }
    var d = param.seriesData.get(candles);
    var v = param.seriesData.get(volSeries);
    if (!d) return;
    var chg = d.close - d.open;
    el.innerHTML = '<span class="lt">' + new Date(param.time * 1000)   // 伪装 epoch → UTC 读取即北京时间
      .toISOString().slice(0, 16).replace('T', ' ') + '</span>  ' +
      'O <span class="lt">' + fmtP(d.open) + '</span> H <span class="lt">' + fmtP(d.high) +
      '</span> L <span class="lt">' + fmtP(d.low) + '</span> C <span class="lt">' + fmtP(d.close) +
      '</span> <span class="' + (chg >= 0 ? 'pos' : 'neg') + '">' + (chg >= 0 ? '+' : '') + (chg / d.open * 100).toFixed(2) + '%' +
      '</span> V <span class="lt">' + fmtV(v ? v.value : 0) + '</span>';
  });

  // 初次渲染
  function renderPanels() { renderCyqPanel(); renderCompPanel(); renderSessTable(); }
  renderPanels();
  rebuildLines();
  computeVisibleProfile();
  chart.timeScale().fitContent();
  window.addEventListener('resize', function () { renderPanels(); });
  window.__vp = { chart: chart, candles: candles, T: T, comp: comp, sessions: sessions, cyq: cyq, bars: bars };
  // 供 live.js 实时更新模块调用(见 live.js)
  window.__vpApi = {
    getBars: function () { return bars; },
    getSessions: function () { return sessions; },
    getComposite: function () { return comp; },
    getCyq: function () { return cyq; },
    replaceBars: function (nb) { bars = nb; rebuildDayIndex(); setDataAll(); },
    replaceComposite: function (nc) { comp = nc; },
    replaceSessions: function (ns) { sessions = ns; },
    replaceCyq: function (nc) { cyq = nc; },
    renderAll: function () {
      updateHeadStats(); renderPanels(); rebuildLines(); computeVisibleProfile(); chart.applyOptions({});
    },
  };
})();

</script>
<script>
/* 实时更新模块 — 腾讯行情 JSONP 轮询 + 浏览器端 profile 重算.
 *
 * 原理: GitHub Pages 是纯静态站,无法推流;但腾讯行情接口支持 JSONP
 * (<script> 注入不受 CORS 限制),页面自己定时拉最新 1 分钟 K 线与快照,
 * 在浏览器里重算 profile → 图表"准实时"(盘中 30s 一跳,无需任何服务器).
 *
 * 数据链:
 *   qt.gtimg.cn/q=           实时报价(现价/量/换手率)     → 全局变量形式
 *   ifzq.gtimg.cn mkline m1  最近 320 根 1 分钟 K(约 2 天) → _var 回调形式
 *
 * 合并策略: 1m 覆盖的交易日(m≥10 根且首根在 09:30/09:31)整日用 1m 替换
 * 快照 K,避免 5m/1m 混算重复计量;更早的日子保留快照.
 * 算法移植: profile.py 的三角形分摊/VA/HVN·LVN/session/CYQ 在 JS 端等价实现,
 * 保证"刷新重算"与"服务端生成"口径一致(页面加载后做一次等价性自检).
 */
(function () {
  'use strict';
  var D = window.__VP_DATA__;
  var API = window.__vpApi;
  if (!D || !D.tcode || !API) return;          // 无腾讯代码(美股)或旧页面 → 不启用

  var TCODE = D.tcode;
  var state = { timer: null, busy: false, lastOk: null, on: true, failCnt: 0 };
  // raw 格式副本 ({t,o,h,l,c,v,b}),与 app.js 的图表格式(time/buy/sell)分离;
  // merge/session 重算都在 raw 空间做,替换前才转换
  var RAW = (D.bars || []).map(function (b) {
    return { t: b.t, o: b.o, h: b.h, l: b.l, c: b.c, v: b.v, b: b.b };
  });

  function r6(x) { return Math.round(x * 1e6) / 1e6; }
  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }

  // ------------------------------------------------------------------
  // JSONP
  // ------------------------------------------------------------------
  var jpSeq = 0;
  function jsonpVar(url, cbName, cb) {         // 响应是赋值语句 cbName={...}; → onload 后读全局
    var s = document.createElement('script');
    var done = false;
    var timer = setTimeout(function () { finish(null); }, 12000);
    function finish(data) {
      if (done) return; done = true;
      clearTimeout(timer);
      var data2 = arguments.length > 0 ? data : window[cbName];
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
      cb(data2);
    }
    s.onload = function () { finish(window[cbName]); };
    s.onerror = function () { finish(null); };
    s.src = url + (url.indexOf('?') < 0 ? '?' : '&') + '_var=' + cbName + '&r=' + Math.random();
    document.head.appendChild(s);
  }
  function jsonpGlobal(url, varName, cb) {     // 响应形如 varName="...";
    var s = document.createElement('script');
    var done = false;
    var timer = setTimeout(function () { finish(null); }, 12000);
    function finish() {
      if (done) return; done = true;
      clearTimeout(timer);
      var raw = window[varName];
      try { delete window[varName]; } catch (e) { window[varName] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
      cb(raw || null);
    }
    s.onload = finish;
    s.onerror = function () { finish(); };
    s.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'r=' + Math.random();
    document.head.appendChild(s);
  }

  function fetchQuote(cb) {
    jsonpGlobal('https://qt.gtimg.cn/q=' + TCODE, 'v_' + TCODE, function (raw) {
      if (!raw) return cb(null);
      var f = raw.split('~');
      if (f.length < 45) return cb(null);
      var q = {
        price: parseFloat(f[3]), prevClose: parseFloat(f[4]), open: parseFloat(f[5]),
        vol: parseFloat(f[6]), time: f[30], turnover: parseFloat(f[38]),
      };
      if (!isFinite(q.price) || q.price <= 0) return cb(null);
      cb(q);
    });
  }

  function fetchMkline(interval, cb) {
    var cbName = '__vpJp' + (++jpSeq);
    jsonpVar('https://ifzq.gtimg.cn/appstock/app/kline/mkline?param=' + TCODE + ',' + interval + ',,320',
      cbName, function (res) {
        try {
          var node = res && res.data && res.data[TCODE];
          var arr = (node && (node[interval] || node[interval + '_today'])) || [];
          var out = [];
          for (var i = 0; i < arr.length; i++) {
            var k = arr[i], dk = String(k[0]);
            if (dk.length < 12) continue;
            var t = dk.slice(0, 4) + '-' + dk.slice(4, 6) + '-' + dk.slice(6, 8) +
              ' ' + dk.slice(8, 10) + ':' + dk.slice(10, 12);
            var o = +k[1], c = +k[2], h = +k[3], l = +k[4], v = +k[5];   // 腾讯 m1 顺序 O,C,H,L,V
            if (!isFinite(o) || !isFinite(c) || !isFinite(v) || v < 0) continue;
            var bf = h - l < 1e-12 ? (c >= o ? 1 : 0)
              : (c > o ? 1 : (c < o ? 0 : (c - l) / (h - l)));
            out.push({ t: t, o: o, h: h, l: l, c: c, v: v, b: bf * v });
          }
          cb(out);
        } catch (e) { cb([]); }
      });
  }

  // ------------------------------------------------------------------
  // K 线合并 (1m 覆盖日整日替换快照) — raw 空间
  // ------------------------------------------------------------------
  function mergeBars(snapBars, m1) {
    var byDay = {}, i;
    for (i = 0; i < m1.length; i++) {
      var d = m1[i].t.slice(0, 10);
      (byDay[d] = byDay[d] || []).push(m1[i]);
    }
    var covered = {};
    Object.keys(byDay).forEach(function (d) {
      var dbs = byDay[d], hhmm = dbs[0].t.slice(11, 16);
      if (dbs.length >= 10 && (hhmm === '09:30' || hhmm === '09:31')) covered[d] = 1;
    });
    var out = [];
    for (i = 0; i < snapBars.length; i++) if (!covered[snapBars[i].t.slice(0, 10)]) out.push(snapBars[i]);
    for (i = 0; i < m1.length; i++) if (covered[m1[i].t.slice(0, 10)]) out.push(m1[i]);
    out.sort(function (a, b) { return a.t < b.t ? -1 : a.t > b.t ? 1 : 0; });
    var ded = [], lastT = null;
    for (i = 0; i < out.length; i++) { if (out[i].t !== lastT) { ded.push(out[i]); lastT = out[i].t; } }
    return { bars: ded, covered: covered, byDay: byDay };
  }

  function toChartBars(raw) {                  // raw → app.js 图表格式
    return raw.map(function (b) {
      var t = Date.parse(b.t.replace(' ', 'T') + 'Z') / 1000;   // 墙钟伪装 UTC,同 app.js
      return { time: t, o: b.o, h: b.h, l: b.l, c: b.c, v: b.v, buy: b.b, sell: Math.max(0, b.v - b.b), i: 0 };
    });
  }

  // ------------------------------------------------------------------
  // profile 算法移植 (与 profile.py 等价)
  // ------------------------------------------------------------------
  function spreadAll(barsArr, step) {
    var lo = Infinity, hi = -Infinity, i;
    for (i = 0; i < barsArr.length; i++) { if (barsArr[i].l < lo) lo = barsArr[i].l; if (barsArr[i].h > hi) hi = barsArr[i].h; }
    if (!(hi > lo) || !(lo > 0)) return null;
    if (!step) step = Math.max(0.0005, (hi - lo) / 200);
    var base = Math.floor(lo / step) * step;
    var hiE = Math.ceil(hi / step) * step;
    var rows = Math.max(1, Math.round((hiE - base) / step));
    if (rows > 500) { step = (hi - lo) / 500; base = Math.floor(lo / step) * step; rows = Math.max(1, Math.round((hi - base) / step)); }
    var buy = [], sell = [], k;
    for (k = 0; k < rows; k++) { buy.push(0); sell.push(0); }
    barsArr.forEach(function (b) {
      var v = b.v;
      if (!(v > 0)) return;
      var pl = b.l, ph = b.h, avg = (b.o + b.c + b.h + b.l) / 4;
      var bf = b.h - b.l < 1e-12 ? (b.c >= b.o ? 1 : 0)
        : (b.c > b.o ? 1 : (b.c < b.o ? 0 : (b.c - b.l) / (b.h - b.l)));
      if (ph - pl < 1e-12) {                                   // 一字: 单桶
        var k0 = clamp(Math.floor((pl - base) / step), 0, rows - 1);
        buy[k0] += v * bf; sell[k0] += v * (1 - bf);
        return;
      }
      var kLo = Math.max(Math.floor((pl - base) / step), 0);
      var kHi = Math.min(Math.ceil((ph - base) / step), rows - 1);
      if (kHi < kLo) { var tmp = kLo; kLo = kHi; kHi = tmp; }
      var fks = [], fcs = [], kk, c0;
      for (kk = kLo; kk <= kHi; kk++) {                        // 只留中心在 [l,h] 内的桶(负权重防护)
        c0 = base + (kk + 0.5) * step;
        if (c0 >= pl && c0 <= ph) { fks.push(kk); fcs.push(c0); }
      }
      if (!fks.length) {                                       // 极窄: 就近单桶
        var kc = clamp(Math.floor((avg - base) / step), 0, rows - 1);
        buy[kc] += v * bf; sell[kc] += v * (1 - bf);
        return;
      }
      var w = [], sum = 0;
      for (kk = 0; kk < fcs.length; kk++) {
        c0 = fcs[kk];
        var ww = c0 <= avg ? (avg - pl < 1e-12 ? 1 : (c0 - pl) / (avg - pl))
                           : (ph - avg < 1e-12 ? 1 : (ph - c0) / (ph - avg));
        w.push(ww); sum += ww;
      }
      if (sum <= 0) { for (kk = 0; kk < w.length; kk++) w[kk] = 1; sum = w.length; }
      for (kk = 0; kk < fks.length; kk++) {
        var sh = w[kk] / sum * v;
        buy[fks[kk]] += sh * bf; sell[fks[kk]] += sh * (1 - bf);
      }
    });
    var centers = [], total = [];
    for (k = 0; k < rows; k++) { centers.push(r6(base + (k + 0.5) * step)); total.push(buy[k] + sell[k]); }
    return { lo: r6(base), step: step, centers: centers, buy: buy, sell: sell, total: total };
  }

  function valueAreaOf(prof) {
    var total = prof.total, n = total.length, kPoc = 0, i;
    for (i = 1; i < n; i++) if (total[i] > total[kPoc]) kPoc = i;
    var clean = total.map(function (x) { return isFinite(x) && x > 0 ? x : 0; });
    var target = 0;
    clean.forEach(function (x) { target += x; });
    target *= 0.7;
    var acc = clean[kPoc], up = kPoc, dn = kPoc, guard = 0;
    while (acc < target && (up < n - 1 || dn > 0) && guard++ < n * 4) {
      var uv = up < n - 1 ? clean[up + 1] : -1;
      var dv = dn > 0 ? clean[dn - 1] : -1;
      if (uv >= dv) { up++; acc += Math.max(uv, 0); } else { dn--; acc += Math.max(dv, 0); }
      if (!isFinite(acc)) break;
    }
    prof.poc = r6(prof.centers[kPoc]);
    prof.vah = r6(prof.centers[up]);
    prof.val = r6(prof.centers[dn]);
  }

  function hvnLvn(prof) {
    var total = prof.total, n = total.length, W = 5, HALF = 3;
    prof.hvn = []; prof.lvn = [];
    if (n < W * 2 + 1) return;
    var smooth = new Array(n), k, j;
    for (k = 0; k < n; k++) {                                  // np.convolve mode='same' 零填充
      var acc = 0;
      for (j = -2; j <= 2; j++) { var idx = k + j; if (idx >= 0 && idx < n) acc += total[idx]; }
      smooth[k] = acc / W;
    }
    for (k = HALF; k < n - HALF; k++) {
      if (total[k] <= 0) continue;
      var left = 0, right = 0, i2;
      for (i2 = k - HALF; i2 < k; i2++) left += smooth[i2];
      for (i2 = k + 1; i2 <= k + HALF; i2++) right += smooth[i2];
      left /= HALF; right /= HALF;
      var side = Math.min(left, right);
      if (side <= 0) continue;
      var wmax = -Infinity, wmin = Infinity;
      for (i2 = k - HALF; i2 <= k + HALF; i2++) {
        if (smooth[i2] > wmax) wmax = smooth[i2];
        if (smooth[i2] < wmin) wmin = smooth[i2];
      }
      if (total[k] > side * 1.3 && total[k] >= wmax - 1e-9) prof.hvn.push(r6(prof.centers[k]));
      else if (total[k] < side * 0.7 && total[k] <= wmin + 1e-9) prof.lvn.push(r6(prof.centers[k]));
    }
  }

  function compositeFromBars(barsArr) {
    var lo = Infinity, hi = -Infinity, i;
    for (i = 0; i < barsArr.length; i++) { if (barsArr[i].l < lo) lo = barsArr[i].l; if (barsArr[i].h > hi) hi = barsArr[i].h; }
    if (!(hi > lo)) return null;
    var p = spreadAll(barsArr, Math.max(0.0005, (hi - lo) / 200));
    if (!p) return null;
    valueAreaOf(p); hvnLvn(p);
    return p;
  }

  function sessionsFromMerged(merged, oldSessions) {
    var lo = Infinity, hi = -Infinity, i;
    for (i = 0; i < merged.bars.length; i++) { if (merged.bars[i].l < lo) lo = merged.bars[i].l; if (merged.bars[i].h > hi) hi = merged.bars[i].h; }
    if (!(hi > lo)) return oldSessions;
    var step = Math.max(0.0005, (hi - lo) / 120);
    var map = {};
    (oldSessions || []).forEach(function (s) { if (!merged.covered[s.date]) map[s.date] = s; });
    Object.keys(merged.byDay).forEach(function (d) {
      var dbs = merged.byDay[d];
      if (!merged.covered[d] || dbs.length < 5) return;
      var p = spreadAll(dbs, step);
      if (!p) return;
      valueAreaOf(p);
      var vol = 0, buyV = 0, i2;
      for (i2 = 0; i2 < dbs.length; i2++) { vol += dbs[i2].v; buyV += dbs[i2].b; }
      var ibH = -Infinity, ibL = Infinity;                     // Initial Balance: 首 60 根
      for (i2 = 0; i2 < Math.min(60, dbs.length); i2++) {
        if (dbs[i2].h > ibH) ibH = dbs[i2].h;
        if (dbs[i2].l < ibL) ibL = dbs[i2].l;
      }
      map[d] = {
        date: d, open: dbs[0].o, high: -Infinity, low: Infinity, close: dbs[dbs.length - 1].c,
        volume: vol, buy: buyV, sell: vol - buyV, naked_poc: false,
        ib_high: isFinite(ibH) ? ibH : null, ib_low: isFinite(ibL) ? ibL : null, profile: p,
      };
      for (i2 = 0; i2 < dbs.length; i2++) {
        if (dbs[i2].h > map[d].high) map[d].high = dbs[i2].h;
        if (dbs[i2].l < map[d].low) map[d].low = dbs[i2].l;
      }
    });
    var out = Object.keys(map).sort().map(function (k) { return map[k]; }).slice(-40);
    var lastBar = merged.bars[merged.bars.length - 1];
    for (i = 0; i < out.length - 1; i++) {                     // 与 Python 一致: 最后一日不标 naked
      var touched = false, j;
      for (j = i + 1; j < out.length; j++) {
        if (out[j].low <= out[i].profile.poc && out[i].profile.poc <= out[j].high) { touched = true; break; }
      }
      if (!touched && lastBar && lastBar.l <= out[i].profile.poc && out[i].profile.poc <= lastBar.h) touched = true;
      out[i].naked_poc = !touched;
    }
    return out;
  }

  // ------------------------------------------------------------------
  // CYQ 筹码移植 (换手衰减, 口径同东财)
  // ------------------------------------------------------------------
  function applyQuoteToDaily(arr, q) {
    if (!arr || !arr.length || !q || !q.time || !isFinite(q.price)) return arr;
    var qd = q.time.slice(0, 4) + '-' + q.time.slice(4, 6) + '-' + q.time.slice(6, 8);
    var last = arr[arr.length - 1];
    var hslOk = isFinite(q.turnover) && q.turnover > 0 && q.turnover < 100;
    var volOk = isFinite(q.vol) && q.vol > 0;
    if (qd === last[0]) {
      last[2] = Math.max(last[2], q.price);
      last[3] = Math.min(last[3], q.price);
      last[4] = q.price;
      if (volOk) last[5] = q.vol;
      if (hslOk) last[6] = q.turnover;
    } else if (qd > last[0]) {                                  // 新交易日(开盘前的盘前价也收)
      var o = isFinite(q.open) && q.open > 0 ? q.open : q.price;
      arr.push([qd, o, Math.max(o, q.price), Math.min(o, q.price), q.price, volOk ? q.vol : 0, hslOk ? q.turnover : 0]);
    } else return arr;                                          // 行情日期落后(休市旧快照) → 不动
    return arr.slice(-120);
  }

  function cyqFromDaily(dailyArr) {
    if (!dailyArr || dailyArr.length < 20) return null;
    var d = dailyArr.slice(-120), i;
    var hi = -Infinity, lo = Infinity;
    for (i = 0; i < d.length; i++) { if (d[i][2] > hi) hi = d[i][2]; if (d[i][3] < lo) lo = d[i][3]; }
    if (!(hi > lo && lo > 0)) return null;
    var factor = 150, step = Math.max(0.01, (hi - lo) / (factor - 1));
    var centers = [], chips = new Array(factor), k;
    for (k = 0; k < factor; k++) { centers.push(r6(lo + step * k)); chips[k] = 0; }
    d.forEach(function (row) {
      var o = row[1], h = row[2], l = row[3], c = row[4], v = row[5] || 0;
      var t = clamp(row[6] || 0, 0, 100) / 100;
      var avg = (o + c + h + l) / 4;
      for (k = 0; k < factor; k++) chips[k] *= (1 - t);
      if (h - l < 1e-12) {
        chips[clamp(Math.floor((avg - lo) / step), 0, factor - 1)] += v * t;
        return;
      }
      var wsum = 0;
      var w = new Array(factor);
      for (k = 0; k < factor; k++) {
        var p = k * step + lo, ww = 0;
        if (p >= l - 1e-9 && p <= h + 1e-9) {
          ww = p <= avg ? (avg - l < 1e-12 ? 1 : (p - l) / (avg - l))
                        : (h - avg < 1e-12 ? 1 : (h - p) / (h - avg));
          if (!(ww > 0)) ww = 0;
        }
        w[k] = ww; wsum += ww;
      }
      if (wsum <= 0) return;
      var g0 = v * t * 2;
      for (k = 0; k < factor; k++) chips[k] += w[k] / wsum * g0 / 2;
    });
    var total = 0;
    chips.forEach(function (x) { total += x; });
    if (total <= 0) return null;
    var cum = [], acc2 = 0;
    for (i = 0; i < factor; i++) { acc2 += chips[i]; cum.push(acc2); }
    function paq(q) {
      var tgt = total * q, a = 0, b = factor - 1;
      while (a < b) { var m = (a + b) >> 1; if (cum[m] < tgt) a = m + 1; else b = m; }
      return centers[Math.min(a, factor - 1)];
    }
    function searchLeft(arr, x) {
      var a = 0, b = arr.length;
      while (a < b) { var m = (a + b) >> 1; if (arr[m] < x) a = m + 1; else b = m; }
      return a;
    }
    var maxIdx = 0;
    for (i = 1; i < factor; i++) if (chips[i] > chips[maxIdx]) maxIdx = i;
    var close = d[d.length - 1][4];
    var poc = centers[maxIdx];
    var avgCost = paq(0.5);
    var benefit = close >= centers[0] ? cum[Math.min(searchLeft(centers, close), factor - 1)] / total : 0;
    var r90lo = paq(0.05), r90hi = paq(0.95), r70lo = paq(0.15), r70hi = paq(0.85);
    function conc(a, b) { return (a + b) ? Math.round((b - a) / (a + b) * 1e4) / 1e4 : 0; }
    return {
      date: d[d.length - 1][0], centers: centers,
      chips: chips.map(function (x) { return Math.round(x / total * 1e6) / 1e6; }),
      poc: poc, avg_cost: Math.round(avgCost * 1e4) / 1e4,
      benefit: Math.round(benefit * 1e4) / 1e4,
      r70: [Math.round(r70lo * 1e4) / 1e4, Math.round(r70hi * 1e4) / 1e4], c70: conc(r70lo, r70hi),
      r90: [Math.round(r90lo * 1e4) / 1e4, Math.round(r90hi * 1e4) / 1e4], c90: conc(r90lo, r90hi),
      close: close,
    };
  }

  // ------------------------------------------------------------------
  // 调度 + UI
  // ------------------------------------------------------------------
  function beijingNow() { return new Date(Date.now() + (new Date().getTimezoneOffset() + 480) * 60e3); }
  function isMarketHours() {                                   // A 股 9:15-11:30 / 13:00-15:05 (港股午后尾段按盘后处理)
    var d = beijingNow();
    if (d.getDay() < 1 || d.getDay() > 5) return false;
    var m = d.getHours() * 60 + d.getMinutes();
    return (m >= 555 && m <= 690) || (m >= 780 && m <= 905);
  }

  var statusEl = document.getElementById('liveStatus');
  function setStatus(txt, isErr) {
    if (statusEl) { statusEl.textContent = txt; statusEl.style.color = isErr ? '#ef5350' : ''; }
  }

  function refresh() {
    if (state.busy) return;
    state.busy = true;
    setStatus('⇡ 行情更新中…');
    fetchQuote(function (q) {
      if (!q) {
        state.busy = false; state.failCnt++;
        setStatus('✕ 行情获取失败(重试中)', true);
        schedule(); return;
      }
      var dailyArr = D.dailyArr ? applyQuoteToDaily(D.dailyArr, q) : null;
      fetchMkline('m1', function (m1) {
        try {
          var changed = false;
          if (m1 && m1.length) {
            var merged = mergeBars(RAW, m1);
            if (merged.bars.length !== RAW.length ||
                merged.bars[merged.bars.length - 1].t !== RAW[RAW.length - 1].t) {
              var comp2 = compositeFromBars(merged.bars);
              var sess2 = sessionsFromMerged(merged, D.sessions || []);
              RAW = merged.bars;
              API.replaceBars(toChartBars(merged.bars));
              if (comp2) API.replaceComposite(comp2);
              if (sess2 && sess2.length) API.replaceSessions(sess2);
              changed = true;
            }
          }
          if (dailyArr) {
            var cyq2 = cyqFromDaily(dailyArr);
            if (cyq2) { API.replaceCyq(cyq2); changed = true; }
          }
          API.renderAll();
          state.lastOk = new Date();
          state.failCnt = 0;
          var chg = q.prevClose ? (q.price / q.prevClose - 1) * 100 : 0;
          setStatus((changed ? '● 已更新 ' : '○ 无变化 ') +
            state.lastOk.toTimeString().slice(0, 8) +
            ' · 现价 ' + q.price + ' (' + (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%)' +
            ' · ' + (isMarketHours() ? '盘中 30s 轮询' : '休市 5min 轮询'));
        } catch (e) {
          if (window.__vpErrs) window.__vpErrs.push('live: ' + String(e));
          setStatus('✕ 更新异常: ' + e.message, true);
        }
        state.busy = false;
        schedule();
      });
    });
  }

  function schedule() {
    if (state.timer) clearTimeout(state.timer);
    if (!state.on) return;
    state.timer = setTimeout(function () { refresh(); }, isMarketHours() ? 30000 : 300000);
  }

  // 实时开关(追加到 toolbar)
  var tgl = document.createElement('span');
  tgl.className = 'tgl on';
  tgl.textContent = '实时';
  tgl.title = '盘中每 30 秒拉取腾讯行情并在浏览器重算 profile';
  tgl.onclick = function () {
    state.on = !state.on;
    tgl.className = 'tgl' + (state.on ? ' on' : '');
    if (state.on) refresh();
    else if (state.timer) { clearTimeout(state.timer); state.timer = null; setStatus('实时已关'); }
  };
  document.getElementById('toolbar').appendChild(tgl);

  // 加载 2.5s 后首刷(与快照做一次等价合并), 之后进入轮询
  setTimeout(function () { refresh(); }, 2500);

  // 调试/测试钩子 (bars 为 raw 格式)
  window.__vpLive = {
    refresh: refresh, mergeBars: mergeBars, toChartBars: toChartBars,
    raw: function () { return RAW; },
    compositeFromBars: compositeFromBars, sessionsFromMerged: sessionsFromMerged,
    cyqFromDaily: cyqFromDaily,
  };
})();

</script>
